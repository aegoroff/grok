[tools]
zig = "master"

[tasks."build:zig"]
description = "Build project"
shell = "bash -c"
run = [
  """
    set -euo pipefail
    [[ -n "${ABI:-}" ]] || ABI=musl
    [[ -n "${OS:-}" ]] || OS=linux
    [[ -n "${ARCH:-}" ]] || ARCH=x86_64
    [[ -z "${VERSION:-}" || "${VERSION}" =~ ^[0-9]+/merge$ ]] && VERSION="0.6.0-dev"
    export VERSION

    TRIPLE="${ARCH}-${OS}-${ABI}"
    OUT_DIR=zig-out
    BIN_DIR=bin
    OPTIMIZE=ReleaseFast
    ZIG_PREFIX_DIR="bin-${ARCH}-${OS}-${ABI}"

    mkdir -p "${BIN_DIR}"
    rm -f "${OUT_DIR}/grok-${VERSION}-${ARCH}-${OS}-${ABI}.tar" \
          "${OUT_DIR}/grok-${VERSION}-${ARCH}-${OS}-${ABI}.tar.gz"

    DCPU=()
    [[ -n "${CPU:-}" ]] && DCPU=(-Dcpu="${CPU}")

    if [[ "${OS}" = "linux" && "${ARCH}" = "x86_64" ]]; then
      zig build test -Doptimize=Debug -Dtarget="${TRIPLE}" -Dversion="${VERSION}" "${DCPU[@]}" --summary all
      zig build test -Doptimize="${OPTIMIZE}" -Dtarget="${TRIPLE}" -Dversion="${VERSION}" "${DCPU[@]}" --summary all
    fi

    zig build archive \
      -Doptimize="${OPTIMIZE}" \
      -Dtarget="${TRIPLE}" \
      -Dversion="${VERSION}" \
      "${DCPU[@]}" \
      --summary all \
      --prefix-exe-dir "${ZIG_PREFIX_DIR}"

    TARBALL="${OUT_DIR}/grok-${VERSION}-${ARCH}-${OS}-${ABI}.tar.gz"
    [[ -f "${TARBALL}" ]] || { echo "tarball not found: ${TARBALL}" >&2; exit 1; }

    cp -v "${TARBALL}" "${BIN_DIR}/"

    if [[ "${OS}" = "linux" && "${ABI}" = "musl" ]]; then
      chmod +x ./scripts/package_linux.sh
      ./scripts/package_linux.sh "${VERSION}" "${ARCH}" "${TARBALL}" "${BIN_DIR}" "deb,rpm,apk"
    fi
  """
]
